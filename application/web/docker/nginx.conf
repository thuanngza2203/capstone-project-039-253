# Thay proxy của Vite khi chạy bằng Docker: /detection/... -> detection:8005, /rag/... -> rag:8010.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ảnh lá cây gửi lên detection.
    client_max_body_size 25m;

    # DNS của Docker, phân giải lúc có request: backend khởi động sau web vẫn gọi được.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Model 27B trên Vast có thể mất 10-30 giây; lượt đầu còn chờ nạp model nhận diện.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /detection/ {
        set $detection http://detection:8005;
        rewrite ^/detection/(.*)$ /$1 break;
        proxy_pass $detection;
    }

    location /rag/ {
        set $rag http://rag:8010;
        rewrite ^/rag/(.*)$ /$1 break;
        proxy_pass $rag;
    }

    # React Router: mọi đường dẫn khác trả index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
